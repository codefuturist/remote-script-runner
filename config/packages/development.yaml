# development.yaml - Development tools and utilities
# Usage: rsr pkg install-profile development
#
# Essential development tools for software engineers.
# Includes build tools, editors, and common CLI utilities.

name: development
description: Essential development tools for software engineers
version: "1.0.0"
category: development

packages:
  # Version Control
  - git
  - git-lfs

  # Build Tools
  - build-essential
  - cmake
  - make

  # Editors
  - vim
  - nano

  # Shell utilities
  - curl
  - wget
  - jq
  - tree
  - htop
  - tmux
  - screen

  # Network tools
  - netcat
  - nmap

  # File utilities
  - rsync
  - unzip
  - zip
  - tar

optional:
  # Modern CLI tools
  - name: neovim
    brew: neovim
    winget: Neovim.Neovim
    choco: neovim
    apt: neovim
    dnf: neovim

  - name: zsh
    brew: zsh
    apt: zsh
    dnf: zsh

  - name: fzf
    brew: fzf
    winget: junegunn.fzf
    choco: fzf
    apt: fzf
    dnf: fzf

  - name: ripgrep
    brew: ripgrep
    winget: BurntSushi.ripgrep.MSVC
    choco: ripgrep
    apt: ripgrep
    dnf: ripgrep

  - name: fd
    brew: fd
    winget: sharkdp.fd
    choco: fd
    apt: fd-find
    dnf: fd-find

  - name: bat
    brew: bat
    winget: sharkdp.bat
    choco: bat
    apt: bat
    dnf: bat

  - name: exa
    brew: exa
    winget: ogham.exa
    choco: exa
    apt: exa

  - name: tldr
    brew: tldr
    winget: tldr-pages.tlrc
    choco: tldr
    apt: tldr

platforms:
  darwin:
    packages:
      - coreutils
      - gnu-sed
      - grep
      - findutils
    skip:
      - build-essential
    note: "Xcode Command Line Tools provides build essentials"

  alpine:
    packages:
      - build-base
    skip:
      - build-essential

  arch:
    packages:
      - base-devel
    skip:
      - build-essential

