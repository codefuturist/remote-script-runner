# secrets.yaml - Secrets management and encryption tools
# Usage: rsr pkg install secrets
#        rsr pkg install secrets.password-managers
#        rsr pkg install secrets.encryption

name: secrets
description: Secrets management and encryption tools
version: "2.0.0"
category: security

packages:
  - openssl
  - gnupg

groups:
  password-managers:
    description: Command-line password managers
    packages:
      - name: 1password-cli
        description: 1Password CLI
        brew: 1password-cli
        winget: AgileBits.1Password.CLI
        choco: 1password
        apt: 1password

      - name: bitwarden-cli
        description: Bitwarden CLI
        brew: bitwarden-cli
        winget: Bitwarden.CLI
        choco: bitwarden-cli
        apt: bitwarden

  encryption:
    description: Encryption and secrets tools
    packages:
      - name: age
        description: Simple, modern file encryption
        brew: age
        winget: FiloSottile.age
        choco: age
        apt: age
        dnf: age

      - name: sops
        description: Secrets operations - secrets management for YAML/JSON
        brew: sops
        winget: mozilla.sops
        choco: sops
        apt: sops

      - name: sealed-secrets
        description: Kubernetes sealed secrets
        brew: sealed-secrets
        winget: Sealed.SecretsController
        apt: sealed-secrets

      - name: transcrypt
        description: Transparent encryption of git repos
        brew: transcrypt
        apt: transcrypt

      - name: git-secret
        description: Bash-tool to store private data inside a git repo
        brew: git-secret
        winget: sobolevn.git-secret
        apt: git-secret
        dnf: git-secret

  key-management:
    description: SSH and GPG key management
    packages:
      - name: gpg
        description: GNU Privacy Guard
        brew: gnupg
        winget: GnuPG.GnuPG
        choco: gpg4win
        apt: gnupg
        dnf: gnupg

      - name: ssh-keygen
        description: OpenSSH key generation tools
        apt: openssh-client
        dnf: openssh-clients

      - name: keychain
        description: SSH and GPG key manager
        brew: keychain
        apt: keychain
        dnf: keychain

      - name: pass
        description: Standard password manager
        brew: pass
        winget: passwordstore.pass
        choco: pass
        apt: pass
        dnf: pass

  security-keys:
    description: Hardware security key management (YubiKey, FIDO2, U2F)
    packages:
      # YubiKey Core Tools
      - name: yubikey-manager
        description: YubiKey Manager CLI (ykman) - configure all YubiKey features
        recommended:
          darwin: brew
          linux: apt
        brew: ykman
        winget: Yubico.YubikeyManager
        apt: yubikey-manager
        dnf: yubikey-manager
        pacman: yubikey-manager
        note: "Primary tool for YubiKey configuration (OTP, FIDO2, PIV, OATH)"

      - name: yubico-piv-tool
        description: YubiKey PIV (smart card) management tool
        recommended:
          darwin: brew
          linux: apt
        brew: yubico-piv-tool
        apt: yubico-piv-tool
        dnf: yubico-piv-tool
        pacman: yubico-piv-tool
        note: "Manage PIV certificates and smart card functionality"

      - name: yubikey-personalization
        description: YubiKey personalization tool (legacy OTP configuration)
        recommended:
          darwin: brew
          linux: apt
        brew: yubikey-personalization
        apt: yubikey-personalization
        dnf: yubikey-personalization-gui
        pacman: yubikey-personalization
        note: "Legacy tool for OTP configuration. Use ykman for modern setups."

      # YubiKey GUI Tools
      - name: yubikey-manager-qt
        description: YubiKey Manager GUI application
        recommended:
          darwin: brew
          linux: apt
        brew: --cask yubico-yubikey-manager
        apt: yubikey-manager-qt
        dnf: yubikey-manager-qt
        pacman: yubikey-manager-qt
        flatpak: com.yubico.yubioath
        note: "Graphical interface for YubiKey Manager"

      - name: yubioath-desktop
        description: YubiKey Authenticator - TOTP/HOTP credential manager
        recommended:
          darwin: brew
          linux: flatpak
        brew: --cask yubico-authenticator
        flatpak: com.yubico.yubioath
        note: "Manage 2FA codes (TOTP/HOTP) stored on YubiKey"

      # FIDO2/U2F Core Libraries
      - name: libfido2
        description: FIDO2 library for communication with authenticators
        recommended:
          darwin: brew
          linux: apt
        brew: libfido2
        apt: libfido2-1
        dnf: libfido2
        pacman: libfido2
        apk: libfido2
        note: "Required library for FIDO2 protocol support"

      - name: fido2-tools
        description: FIDO2 command-line tools (fido2-token, fido2-cred, fido2-assert)
        recommended:
          linux: apt
        apt: fido2-tools
        dnf: fido2-tools
        pacman: libfido2
        note: "CLI tools for FIDO2 key management and testing"

      # U2F Tools
      - name: pam-u2f
        description: PAM module for U2F authentication
        recommended:
          linux: apt
        brew: pam-u2f
        apt: libpam-u2f
        dnf: pam-u2f
        pacman: pam-u2f
        note: "Enable U2F for system login and sudo authentication"

      - name: libu2f-host
        description: U2F host library
        recommended:
          linux: apt
        brew: libu2f-host
        apt: libu2f-host
        dnf: libu2f-host
        pacman: libu2f-host
        note: "Yubico U2F host C library"

      # Age Encryption Integration
      - name: age-plugin-yubikey
        description: Age encryption plugin for YubiKey PIV
        recommended:
          darwin: brew
          linux: cargo
        brew: age-plugin-yubikey
        cargo: age-plugin-yubikey
        note: "Use YubiKey PIV for age file encryption/decryption"

      # Other Security Keys
      - name: solo-tools
        description: SoloKeys management CLI (open-source FIDO2 key)
        recommended:
          darwin: brew
          linux: pip
        brew: solo2-cli
        pip: solo1
        note: "Configure SoloKeys FIDO2 security keys"

      - name: nitrokey-app
        description: Nitrokey management application
        recommended:
          linux: apt
        apt: nitrokey-app
        dnf: nitrokey-app
        flatpak: com.nitrokey.nitrokey-app
        note: "Manage Nitrokey Pro and Storage devices"

platforms:
  darwin:
    note: "Most tools available via Homebrew"

  linux:
    note: "All tools available via system package managers"

  windows:
    note: "Some tools require WSL; others have native Windows support"
