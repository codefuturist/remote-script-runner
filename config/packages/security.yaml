# security.yaml - Security and hardening tools
# Usage: rsr pkg install-profile security
#        rsr pkg install security.firewall
#        rsr pkg install security.scanning

name: security
description: Security tools and hardening utilities
version: "2.0.0"
category: security

packages:
  - curl
  - wget

groups:
  firewall:
    description: Firewall and access control
    packages:
      - name: ufw
        description: Uncomplicated Firewall
        apt: ufw

      - name: firewalld
        description: Dynamic firewall (RHEL/Fedora)
        dnf: firewalld

      - name: iptables
        description: Legacy firewall (packet filtering)
        apt: iptables
        dnf: iptables

  intrusion-prevention:
    description: Intrusion detection and prevention
    packages:
      - name: fail2ban
        description: Ban suspicious IP addresses
        brew: fail2ban
        apt: fail2ban
        dnf: fail2ban

      - name: suricata
        description: IDS/IPS and NSM engine
        apt: suricata
        dnf: suricata

      - name: snort
        description: Network intrusion detection system
        apt: snort
        dnf: snort

  scanning:
    description: Security scanning and vulnerability detection
    packages:
      - name: clamav
        description: Antivirus engine
        brew: clamav
        apt: clamav
        dnf: clamav

      - name: rkhunter
        description: Rootkit hunter
        apt: rkhunter
        dnf: rkhunter

      - name: chkrootkit
        description: Check for rootkits
        apt: chkrootkit

      - name: aide
        description: Advanced Intrusion Detection Environment
        apt: aide
        dnf: aide

      - name: tripwire
        description: File integrity checker
        apt: tripwire
        dnf: tripwire

      - name: ossec-hids
        description: OSSEC Host-based IDS
        apt: ossec-hids

  ssl-tls:
    description: SSL/TLS management
    packages:
      - name: openssl
        description: SSL/TLS toolkit
        brew: openssl
        apt: openssl
        dnf: openssl

      - name: ca-certificates
        description: Common CA certificates
        apt: ca-certificates
        dnf: ca-certificates

  audit:
    description: System auditing and logging
    packages:
      - name: auditd
        description: Linux audit daemon
        apt: auditd
        dnf: audit

      - name: lynis
        description: Security auditing tool
        brew: lynis
        apt: lynis
        dnf: lynis

  password:
    description: Password generation and management
    packages:
      - name: pwgen
        description: Password generator
        brew: pwgen
        apt: pwgen
        dnf: pwgen

      - name: apg
        description: Another Password Generator
        apt: apg
        dnf: apg

  encryption:
    description: Encryption and key management
    packages:
      - name: gnupg
        description: GNU Privacy Guard
        brew: gnupg
        winget: GnuPG.GnuPG
        choco: gpg4win
        apt: gnupg
        dnf: gnupg

      - name: cryptsetup
        description: LUKS disk encryption
        apt: cryptsetup
        dnf: cryptsetup

platforms:
  darwin:
    note: "macOS has built-in firewall (pf). Use 'sudo pfctl' for management."

  debian:
    note: "UFW recommended for easy firewall management"

  rhel:
    note: "Use firewalld for firewall management"

