# devops.yaml - DevOps and CI/CD tools
# Usage: rsr pkg install-profile devops
#        rsr pkg install devops.iac
#        rsr pkg install devops.cicd
#
# Includes: development, docker profiles

name: devops
description: DevOps and CI/CD automation tools
version: "2.0.0"
category: devops

includes:
  - development
  - docker

packages:
  - curl
  - wget

groups:
  configuration:
    description: Configuration management
    packages:
      - name: ansible
        description: Infrastructure automation
        brew: ansible
        winget: Ansible.Ansible
        apt: ansible
        dnf: ansible
        pip: ansible

  iac:
    description: Infrastructure as Code tools
    packages:
      - name: terraform
        description: Infrastructure as Code
        brew: terraform
        winget: Hashicorp.Terraform
        choco: terraform
        apt: terraform
        dnf: terraform
        script: curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add - && sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main" && sudo apt-get update && sudo apt-get install terraform

      - name: pulumi
        description: Infrastructure as Code (Python/Go/TS)
        brew: pulumi
        winget: Pulumi.Pulumi
        choco: pulumi

      - name: packer
        description: Image builder
        brew: packer
        winget: Hashicorp.Packer
        choco: packer

  cicd:
    description: CI/CD and automation
    packages:
      - name: jenkins
        description: Continuous integration server
        brew: jenkins
        apt: jenkins

      - name: gitlab-runner
        description: GitLab CI runner
        apt: gitlab-runner
        dnf: gitlab-runner

  secrets:
    description: Secrets management
    packages:
      - name: vault
        description: Secrets and encryption management
        brew: vault
        winget: Hashicorp.Vault
        choco: vault
        apt: vault
        dnf: vault

  cloud:
    description: Cloud CLI tools
    packages:
      - name: awscli
        description: AWS command-line interface
        brew: awscli
        winget: Amazon.AWSCLI
        choco: awscli
        apt: awscli
        pip: awscli

      - name: azure-cli
        description: Azure command-line interface
        brew: azure-cli
        winget: Microsoft.AzureCLI
        choco: azure-cli
        apt: azure-cli

      - name: google-cloud-sdk
        description: Google Cloud SDK
        brew: google-cloud-sdk
        winget: Google.CloudSDK
        apt: google-cloud-sdk

  service-mesh:
    description: Service mesh tools
    packages:
      - name: istioctl
        description: Istio service mesh
        brew: istioctl

      - name: linkerd
        description: Linkerd service mesh
        brew: linkerd

  monitoring:
    description: Monitoring and observability
    packages:
      - name: prometheus
        description: Metrics collection and alerting
        brew: prometheus
        apt: prometheus
        dnf: prometheus

      - name: grafana
        description: Metrics visualization
        brew: grafana
        apt: grafana
        dnf: grafana

  logging:
    description: Log collection and management
    packages:
      - name: filebeat
        description: Log shipper
        apt: filebeat
        dnf: filebeat

      - name: fluentd
        description: Log aggregation engine
        apt: fluentd
        dnf: fluentd

platforms:
  darwin:
    note: "Cloud CLIs available via Homebrew: awscli, azure-cli, google-cloud-sdk"

  linux:
    note: "Most tools available via system package managers; Terraform and Ansible via pip as fallback"

