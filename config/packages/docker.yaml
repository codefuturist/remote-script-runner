 # docker.yaml - Docker and container tools
# Usage: rsr pkg install-profile docker
#
# Docker container platform and related tools.
# Note: On macOS, Docker Desktop is recommended.

name: docker
description: Docker container platform and tools
version: "1.0.0"
category: containers

packages:
  - name: docker
    brew: docker
    winget: Docker.DockerDesktop
    choco: docker-desktop
    apt: docker.io
    dnf: docker

  - name: docker-compose
    brew: docker-compose
    winget: Docker.DockerCompose
    choco: docker-compose
    apt: docker-compose
    dnf: docker-compose

optional:
  # Additional Docker tools
  - name: docker-buildx
    brew: docker-buildx
    apt: docker-buildx

  - containerd

  # Alternative container runtimes
  - name: podman
    brew: podman
    winget: RedHat.Podman
    apt: podman
    dnf: podman

  - name: buildah
    brew: buildah
    apt: buildah
    dnf: buildah

  - skopeo

  # Container inspection
  - name: dive
    brew: dive
    winget: wagoodman.dive
    choco: dive

  - name: ctop
    brew: ctop
    apt: ctop

  # Docker registry
  - docker-registry

platforms:
  darwin:
    note: "Install Docker Desktop from https://docker.com/products/docker-desktop"
    homebrew_casks:
      - docker
    skip:
      - docker
      - docker-compose

  linux:
    post_install:
      - "sudo systemctl enable docker"
      - "sudo systemctl start docker"
      - "sudo usermod -aG docker $USER"
    note: "Log out and back in for group changes to take effect"

  debian:
    packages:
      - docker.io
      - docker-compose

  rhel:
    note: "Add Docker repo first: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo"
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin

