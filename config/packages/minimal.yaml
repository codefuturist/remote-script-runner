# minimal.yaml - Minimal essential packages
# Usage: rsr pkg install-profile minimal
#        rsr pkg install minimal.base
#        rsr pkg install minimal.editors

name: minimal
description: Minimal essential packages for any system
version: "2.0.0"
category: essentials

packages:
  - curl
  - wget

groups:
  base:
    description: Core CLI utilities
    packages:
      - name: git
        description: Distributed version control
        brew: git
        winget: Git.Git
        choco: git
        apt: git
        dnf: git
      - name: jq
        description: JSON processor
        brew: jq
        winget: jqlang.jq
        choco: jq
        apt: jq
        dnf: jq
      - name: htop
        description: Process viewer
        brew: htop
        apt: htop
        dnf: htop
      - name: unzip
        description: Unzip archives
        brew: unzip
        apt: unzip
        dnf: unzip
      - name: zip
        description: Create zip archives
        brew: zip
        apt: zip
        dnf: zip
  editors:
    description: Baseline editors
    packages:
      - name: vim
        description: Vi IMproved editor
        brew: vim
        winget: vim.vim
        choco: vim
        apt: vim
        dnf: vim

platforms:
  darwin:
    note: "All packages available via Homebrew"
  alpine:
    note: "Use 'apk add' for installation"
