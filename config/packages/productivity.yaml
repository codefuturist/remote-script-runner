  # ============================================================================
  # WEB BROWSERS
  # ============================================================================
  browsers:
    description: Web browsers for development and general use
    packages:
      # Privacy-focused browsers
      - name: brave-browser
        description: Brave Browser - privacy-focused browser with ad blocking
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: brave-browser
        winget: Brave.Brave
        choco: brave
        scoop: brave
        flatpak: com.brave.Browser
        snap: brave
        apt: brave-browser
        dnf: brave-browser
        pacman: brave-bin
        script_deb: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt update && sudo apt install -y brave-browser
        script_rpm: |
          sudo dnf install -y dnf-plugins-core
          sudo dnf config-manager --add-repo https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
          sudo rpm --import https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
          sudo dnf install -y brave-browser

      - name: firefox
        description: Mozilla Firefox - open-source web browser
        recommended:
          darwin: brew
          windows: winget
          linux: apt  # Native package preferred over flatpak/snap for system integration
        brew: firefox
        winget: Mozilla.Firefox
        choco: firefox
        scoop: firefox
        apt: firefox
        dnf: firefox
        pacman: firefox
        apk: firefox
        flatpak: org.mozilla.firefox
        snap: firefox

      - name: firefox-developer-edition
        description: Firefox Developer Edition - browser for web developers
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: firefox-developer-edition
        winget: Mozilla.Firefox.DeveloperEdition
        choco: firefox-dev
        flatpak: org.mozilla.firefox
        pacman: firefox-developer-edition
        script: curl -sL "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US" | tar xj -C /opt/

      - name: firefox-esr
        description: Firefox Extended Support Release - stable long-term browser
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: firefox-esr
        winget: Mozilla.Firefox.ESR
        choco: firefoxesr
        apt: firefox-esr
        dnf: firefox-esr
        flatpak: org.mozilla.firefox

      - name: librewolf
        description: LibreWolf - privacy-hardened Firefox fork
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: librewolf
        winget: LibreWolf.LibreWolf
        choco: librewolf
        flatpak: io.gitlab.librewolf-community
        pacman: librewolf
        script: curl -sL https://librewolf.net/installation/linux/ # Follow distro instructions

      - name: tor-browser
        description: Tor Browser - anonymous browsing via Tor network
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: tor-browser
        winget: TorProject.TorBrowser
        choco: tor-browser
        flatpak: com.github.nickvision.tagger
        apt: torbrowser-launcher
        dnf: torbrowser-launcher
        pacman: torbrowser-launcher

      # Chromium-based browsers
      - name: chromium
        description: Chromium - open-source browser (Chrome base)
        recommended:
          darwin: brew
          windows: choco
          linux: apt  # Native package preferred for system integration
        brew: chromium
        choco: chromium
        apt: chromium-browser
        dnf: chromium
        pacman: chromium
        apk: chromium
        flatpak: org.chromium.Chromium
        snap: chromium

      - name: ungoogled-chromium
        description: Ungoogled Chromium - Chromium without Google integration
        recommended:
          darwin: brew
          windows: choco
          linux: flatpak
        brew: eloston-chromium
        choco: ungoogled-chromium
        flatpak: com.github.nickvision.tagger
        pacman: ungoogled-chromium
        script: curl -sL https://ungoogled-software.github.io/ungoogled-chromium-binaries/

      - name: google-chrome
        description: Google Chrome - Google's web browser
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: google-chrome
        winget: Google.Chrome
        choco: googlechrome
        apt: google-chrome-stable
        dnf: google-chrome-stable
        flatpak: com.google.Chrome
        script_deb: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt update && sudo apt install -y google-chrome-stable

      - name: microsoft-edge
        description: Microsoft Edge - Chromium-based browser
        recommended:
          darwin: brew
          windows: winget  # Pre-installed on Windows 11
          linux: apt
        brew: microsoft-edge
        winget: Microsoft.Edge
        choco: microsoft-edge
        apt: microsoft-edge-stable
        dnf: microsoft-edge-stable
        flatpak: com.microsoft.Edge
        script_deb: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt update && sudo apt install -y microsoft-edge-stable

      - name: vivaldi
        description: Vivaldi - feature-rich browser for power users
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: vivaldi
        winget: Vivaldi.Vivaldi
        choco: vivaldi
        apt: vivaldi-stable
        dnf: vivaldi-stable
        flatpak: com.vivaldi.Vivaldi
        pacman: vivaldi
        script_deb: |
          wget -qO- https://repo.vivaldi.com/archive/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/vivaldi.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/vivaldi.gpg] https://repo.vivaldi.com/archive/deb/ stable main" | sudo tee /etc/apt/sources.list.d/vivaldi.list
          sudo apt update && sudo apt install -y vivaldi-stable

      - name: opera
        description: Opera - browser with built-in VPN and ad blocker
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: opera
        winget: Opera.Opera
        choco: opera
        flatpak: com.opera.Opera
        apt: opera-stable
        snap: opera

      # Developer/specialty browsers
      - name: arc
        description: Arc Browser - modern browser with workspaces
        recommended:
          darwin: brew
          windows: winget
        brew: arc
        winget: TheBrowserCompany.Arc

      - name: min
        description: Min - minimal, privacy-focused browser
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: min
        winget: nickvision.MinBrowser
        choco: min
        flatpak: io.github.nickvision.money
        apt: min
        script: curl -sL https://github.com/nickvision-apps/min/releases/latest

      - name: qutebrowser
        description: Qutebrowser - keyboard-driven vim-like browser
        recommended:
          darwin: brew
          windows: choco
          linux: apt
        brew: qutebrowser
        choco: qutebrowser
        apt: qutebrowser
        dnf: qutebrowser
        pacman: qutebrowser
        flatpak: org.qutebrowser.qutebrowser
        pip: qutebrowser

      - name: nyxt
        description: Nyxt - keyboard-oriented extensible web browser
        recommended:
          darwin: brew
          linux: flatpak
        brew: nyxt
        flatpak: engineer.atlas.Nyxt
        pacman: nyxt
        guix: nyxt

      # WebKit-based browsers
      - name: epiphany
        description: GNOME Web (Epiphany) - WebKit-based browser
        recommended:
          linux: apt
        apt: epiphany-browser
        dnf: epiphany
        flatpak: org.gnome.Epiphany
        pacman: epiphany

      - name: falkon
        description: Falkon - KDE QtWebEngine browser
        recommended:
          linux: apt
        apt: falkon
        dnf: falkon
        flatpak: org.kde.falkon
        pacman: falkon

  # ============================================================================
  # HEADLESS BROWSERS AND BROWSER AUTOMATION
  # ============================================================================
  headless-browsers:
    description: Headless browsers and browser automation tools for testing and scraping
    packages:
      # Browser automation frameworks
      - name: playwright
        description: Playwright - cross-browser automation (Chromium, Firefox, WebKit)
        recommended:
          all: npm
        npm: playwright
        pip: playwright
        brew: playwright
        script: npm install -g playwright && npx playwright install

      - name: puppeteer
        description: Puppeteer - headless Chrome/Chromium automation
        recommended:
          all: npm
        npm: puppeteer
        script: npm install -g puppeteer

      - name: selenium
        description: Selenium WebDriver for browser automation
        recommended:
          all: pip
        pip: selenium
        npm: selenium-webdriver
        brew: selenium-server
        apt: python3-selenium

      - name: cypress
        description: Cypress - end-to-end testing framework
        recommended:
          all: npm
        npm: cypress
        brew: cypress
        script: npm install -g cypress

      # WebDriver implementations
      - name: chromedriver
        description: ChromeDriver - WebDriver for Chrome/Chromium
        recommended:
          darwin: brew
          windows: choco
          linux: apt
        brew: chromedriver
        choco: chromedriver
        apt: chromium-chromedriver
        dnf: chromedriver
        pacman: chromedriver
        npm: chromedriver
        script: npx @puppeteer/browsers install chromedriver@stable

      - name: geckodriver
        description: GeckoDriver - WebDriver for Firefox
        recommended:
          darwin: brew
          windows: choco
          linux: apt
        brew: geckodriver
        choco: selenium-gecko-driver
        apt: firefox-geckodriver
        dnf: geckodriver
        pacman: geckodriver
        cargo: geckodriver
        script: curl -sL https://github.com/mozilla/geckodriver/releases/latest/download/geckodriver-linux64.tar.gz | tar xz -C /usr/local/bin/

      - name: msedgedriver
        description: Microsoft Edge WebDriver
        recommended:
          darwin: brew
          windows: winget
        brew: microsoft-edge-driver
        winget: Microsoft.EdgeWebDriver
        script: curl -sL "https://msedgedriver.azureedge.net/LATEST_STABLE" | xargs -I {} curl -sL "https://msedgedriver.azureedge.net/{}/edgedriver_linux64.zip" -o edgedriver.zip && unzip edgedriver.zip

      - name: safaridriver
        description: Safari WebDriver (macOS built-in)
        note: "Included with Safari on macOS. Enable via: safaridriver --enable"

      # Headless browser engines
      - name: chromium-headless
        description: Chromium in headless mode (use with --headless flag)
        note: "Use chromium --headless --disable-gpu for headless mode"
        brew: chromium
        apt: chromium-browser
        dnf: chromium
        pacman: chromium

      - name: firefox-headless
        description: Firefox in headless mode (use with --headless flag)
        note: "Use firefox --headless for headless mode"
        brew: firefox
        apt: firefox
        dnf: firefox
        pacman: firefox

      # Lightweight headless browsers
      - name: phantomjs
        description: PhantomJS - scriptable headless browser (legacy)
        note: "Deprecated - consider using Playwright or Puppeteer instead"
        brew: phantomjs
        choco: phantomjs
        apt: phantomjs
        npm: phantomjs-prebuilt

      - name: splash
        description: Splash - lightweight scriptable browser for web scraping
        recommended:
          all: docker
        pip: splash
        docker: scrapinghub/splash
        script: docker run -p 8050:8050 scrapinghub/splash

      - name: browserless
        description: Browserless - headless Chrome as a service
        recommended:
          all: docker
        docker: browserless/chrome
        script: docker run -p 3000:3000 browserless/chrome

      # Browser testing tools
      - name: webdriverio
        description: WebdriverIO - browser and mobile automation framework
        recommended:
          all: npm
        npm: webdriverio
        script: npm install -g @wdio/cli

      - name: nightwatch
        description: Nightwatch.js - end-to-end testing framework
        recommended:
          all: npm
        npm: nightwatch
        script: npm install -g nightwatch

      - name: testcafe
        description: TestCafe - cross-browser end-to-end testing
        recommended:
          all: npm
        npm: testcafe
        brew: testcafe
        script: npm install -g testcafe

      # HTTP clients and scraping tools
      - name: curl-impersonate
        description: curl-impersonate - curl with browser TLS fingerprints
        recommended:
          darwin: brew
          linux: script
        brew: curl-impersonate
        script: curl -sL https://github.com/lwthiker/curl-impersonate/releases/latest/download/curl-impersonate-linux.tar.gz | tar xz -C /usr/local/bin/

      - name: httpx
        description: httpx - fast HTTP toolkit for web reconnaissance
        recommended:
          darwin: brew
          linux: go
        brew: httpx
        go: github.com/projectdiscovery/httpx/cmd/httpx@latest
        apt: httpx
        script: go install github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: katana
        description: Katana - fast web crawler
        recommended:
          darwin: brew
          linux: go
        brew: katana
        go: github.com/projectdiscovery/katana/cmd/katana@latest
        script: go install github.com/projectdiscovery/katana/cmd/katana@latest

      # Screenshot and rendering tools
      - name: shot-scraper
        description: shot-scraper - CLI tool for screenshots and scraping
        recommended:
          all: pip
        pip: shot-scraper
        pipx: shot-scraper
        brew: shot-scraper
        script: pip install shot-scraper && shot-scraper install

      - name: pageres-cli
        description: Pageres - capture screenshots of websites
        recommended:
          all: npm
        npm: pageres-cli
        script: npm install -g pageres-cli

      - name: capture-website-cli
        description: Capture Website - screenshot websites from CLI
        recommended:
          all: npm
        npm: capture-website-cli
        script: npm install -g capture-website-cli

      - name: percollate
        description: Percollate - web pages to PDF/EPUB
        recommended:
          all: npm
        npm: percollate
        script: npm install -g percollate

      # Browser management
      - name: browsers-cli
        description: Puppeteer browsers CLI - manage browser installations
        recommended:
          all: npm
        npm: "@puppeteer/browsers"
        script: npm install -g @puppeteer/browsers

platforms:
  darwin:
    note: "All packages available via Homebrew"

  linux:
    note: "Most packages available via system package managers"

  windows:
    note: "Some packages may require WSL or alternative Windows installation"
