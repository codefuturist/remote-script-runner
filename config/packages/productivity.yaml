# productivity.yaml - Developer productivity and workflow tools
# Usage: rsr pkg install productivity
#        rsr pkg install productivity.cli-tools
#        rsr pkg install productivity.api-testing

name: productivity
description: Developer productivity tools and CLI utilities
version: "2.0.0"
category: productivity

# Top-level packages
packages:
  - git
  - curl

groups:
  cli-tools:
    description: Modern CLI tools for improved developer workflow
    packages:
      - name: lazygit
        brew: lazygit
        winget: jesseduffield.lazygit
        choco: lazygit
        apt: lazygit
        dnf: lazygit

      - name: gh
        description: GitHub CLI
        brew: gh
        winget: GitHub.cli
        choco: gh
        apt: gh
        dnf: gh

      - name: act
        description: Run GitHub Actions locally
        brew: act
        winget: nektos.act
        choco: act
        apt: act

      - name: direnv
        description: Environment variable management
        brew: direnv
        winget: direnv.direnv
        choco: direnv
        apt: direnv
        dnf: direnv

      - name: starship
        description: Modern shell prompt
        brew: starship
        winget: Starship.Starship
        choco: starship
        apt: starship
        dnf: starship

      - name: ripgrep
        description: Fast grep alternative
        brew: ripgrep
        winget: BurntSushi.ripgrep.MSVC
        choco: ripgrep
        apt: ripgrep
        dnf: ripgrep

      - name: fd
        description: Fast find alternative
        brew: fd
        winget: sharkdp.fd
        choco: fd
        apt: fd-find
        dnf: fd-find

      - name: fzf
        description: Fuzzy finder
        brew: fzf
        winget: junegunn.fzf
        choco: fzf
        apt: fzf
        dnf: fzf

  api-testing:
    description: API testing and load generation tools
    packages:
      - name: httpie
        description: Modern HTTP client
        brew: httpie
        winget: httpie.httpie
        choco: httpie
        apt: httpie
        dnf: httpie

      - name: grpcurl
        description: gRPC testing tool
        brew: grpcurl
        winget: fullstorydev.grpcurl
        choco: grpcurl
        apt: grpcurl

      - name: k6
        description: Modern load testing tool
        brew: k6
        winget: loadimpact.k6
        choco: k6
        apt: k6

      - name: hey
        description: HTTP load generator
        brew: hey
        choco: hey
        apt: hey

  terminal:
    description: Terminal emulators and multiplexers
    packages:
      # Modern GPU-accelerated terminals
      - name: warp
        description: Warp - AI-powered terminal with modern features
        recommended:
          darwin: brew
          linux: script
        brew: warp
        winget: Warp.Warp
        flatpak: dev.warp.Warp
        apt: warp-terminal
        dnf: warp-terminal
        pacman: warp-terminal
        script_deb: |
          curl -fsSL https://releases.warp.dev/linux/keys/warp.asc | sudo gpg --dearmor -o /usr/share/keyrings/warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/warp.gpg] https://releases.warp.dev/linux/deb stable main" | sudo tee /etc/apt/sources.list.d/warp.list
          sudo apt update && sudo apt install -y warp-terminal
        script_rpm: |
          sudo rpm --import https://releases.warp.dev/linux/keys/warp.asc
          sudo sh -c 'echo -e "[warp]\nname=Warp Terminal\nbaseurl=https://releases.warp.dev/linux/rpm/stable\nenabled=1\ngpgcheck=1\ngpgkey=https://releases.warp.dev/linux/keys/warp.asc" > /etc/yum.repos.d/warp.repo'
          sudo dnf install -y warp-terminal

      - name: wezterm
        description: WezTerm - GPU-accelerated cross-platform terminal
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: wezterm
        winget: wez.wezterm
        choco: wezterm
        flatpak: org.wezfurlong.wezterm
        apt: wezterm
        dnf: wezterm
        pacman: wezterm
        script: curl -fsSL https://apt.fury.io/wez/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/wezterm.gpg && echo "deb [signed-by=/usr/share/keyrings/wezterm.gpg] https://apt.fury.io/wez/ * *" | sudo tee /etc/apt/sources.list.d/wezterm.list && sudo apt update && sudo apt install -y wezterm

      - name: kitty
        description: Kitty - fast GPU-based terminal emulator
        recommended:
          darwin: brew
          linux: apt
        brew: kitty
        winget: kovidgoyal.kitty
        apt: kitty
        dnf: kitty
        pacman: kitty
        flatpak: com.github.nickvision.cavalier
        pip: kitty
        script: curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin

      - name: alacritty
        description: Alacritty - fast OpenGL terminal emulator
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: alacritty
        winget: Alacritty.Alacritty
        choco: alacritty
        apt: alacritty
        dnf: alacritty
        pacman: alacritty
        flatpak: org.alacritty.Alacritty
        snap: alacritty
        cargo: alacritty

      - name: hyper
        description: Hyper - Electron-based terminal with web technologies
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: hyper
        winget: Vercel.Hyper
        choco: hyper
        flatpak: co.zeit.Hyper
        apt: hyper
        snap: hyper
        script: curl -sL https://releases.hyper.is/download/deb -o hyper.deb && sudo dpkg -i hyper.deb

      - name: tabby
        description: Tabby - modern configurable terminal
        recommended:
          darwin: brew
          windows: winget
          linux: flatpak
        brew: tabby
        winget: Eugeny.Tabby
        choco: tabby
        flatpak: org.tabby.Tabby
        apt: tabby
        pacman: tabby-terminal
        snap: tabby

      - name: rio
        description: Rio - hardware-accelerated GPU terminal
        recommended:
          darwin: brew
          linux: cargo
        brew: rio
        winget: raphaelamorim.rio
        cargo: rio
        pacman: rio
        script: cargo install rio

      - name: ghostty
        description: Ghostty - fast native terminal by Mitchell Hashimoto
        recommended:
          darwin: brew
          linux: script
        brew: ghostty
        script: git clone https://github.com/ghostty-org/ghostty && cd ghostty && zig build -Doptimize=ReleaseFast

      # Platform-specific terminals
      - name: iterm2
        description: iTerm2 - macOS terminal replacement
        recommended:
          darwin: brew
        brew: iterm2
        mas: "1218902972"

      - name: terminal-app
        description: Apple Terminal (macOS built-in)
        note: "Included with macOS. No installation required."

      - name: windows-terminal
        description: Windows Terminal - modern terminal for Windows
        recommended:
          windows: winget
        winget: Microsoft.WindowsTerminal
        choco: microsoft-windows-terminal
        scoop: windows-terminal
        note: "Pre-installed on Windows 11. Available in Microsoft Store."

      - name: fluent-terminal
        description: Fluent Terminal - UWP terminal for Windows
        winget: AJM.FluentTerminal
        choco: fluent-terminal

      # Linux-native terminals
      - name: gnome-terminal
        description: GNOME Terminal - default GNOME terminal
        apt: gnome-terminal
        dnf: gnome-terminal
        pacman: gnome-terminal

      - name: konsole
        description: Konsole - KDE terminal emulator
        apt: konsole
        dnf: konsole
        pacman: konsole
        flatpak: org.kde.konsole

      - name: tilix
        description: Tilix - tiling terminal emulator for Linux
        apt: tilix
        dnf: tilix
        pacman: tilix
        flatpak: com.gexperts.Tilix

      - name: terminator
        description: Terminator - multiple terminals in one window
        brew: terminator
        apt: terminator
        dnf: terminator
        pacman: terminator
        flatpak: net.launchpad.Terminator

      - name: guake
        description: Guake - drop-down terminal for GNOME
        apt: guake
        dnf: guake
        pacman: guake
        flatpak: com.uploadedlobster.peek

      - name: yakuake
        description: Yakuake - drop-down terminal for KDE
        apt: yakuake
        dnf: yakuake
        pacman: yakuake
        flatpak: org.kde.yakuake

      - name: xterm
        description: XTerm - standard X Window terminal
        brew: xterm
        apt: xterm
        dnf: xterm
        pacman: xterm

      - name: urxvt
        description: rxvt-unicode - lightweight terminal
        apt: rxvt-unicode
        dnf: rxvt-unicode
        pacman: rxvt-unicode

      - name: st
        description: suckless simple terminal
        apt: stterm
        pacman: st
        script: git clone https://git.suckless.org/st && cd st && sudo make clean install

      - name: foot
        description: Foot - fast Wayland terminal
        apt: foot
        dnf: foot
        pacman: foot
        flatpak: org.codeberg.dnkl.foot

      # Terminal multiplexers
      - name: tmux
        description: tmux - terminal multiplexer
        recommended:
          darwin: brew
          linux: apt
        brew: tmux
        winget: tmux.tmux
        choco: tmux
        apt: tmux
        dnf: tmux
        pacman: tmux
        apk: tmux

      - name: screen
        description: GNU Screen - terminal multiplexer
        brew: screen
        apt: screen
        dnf: screen
        pacman: screen
        apk: screen

      - name: zellij
        description: Zellij - modern terminal workspace with layouts
        recommended:
          darwin: brew
          linux: cargo
        brew: zellij
        apt: zellij
        dnf: zellij
        pacman: zellij
        cargo: zellij
        script: cargo install zellij

      - name: byobu
        description: Byobu - enhanced profiles for tmux/screen
        brew: byobu
        apt: byobu
        dnf: byobu
        pacman: byobu
        snap: byobu

      - name: abduco
        description: abduco - session management for terminal
        brew: abduco
        apt: abduco
        dnf: abduco
        pacman: abduco

      - name: dtach
        description: dtach - simple program that emulates detach feature of screen
        brew: dtach
        apt: dtach
        dnf: dtach
        pacman: dtach

      # Serial/SSH terminal tools
      - name: minicom
        description: Minicom - serial communication program
        brew: minicom
        apt: minicom
        dnf: minicom
        pacman: minicom

      - name: picocom
        description: Picocom - minimal serial terminal
        brew: picocom
        apt: picocom
        dnf: picocom
        pacman: picocom

      - name: mosh
        description: Mosh - mobile shell with roaming support
        recommended:
          darwin: brew
          linux: apt
        brew: mosh
        apt: mosh
        dnf: mosh
        pacman: mosh
        apk: mosh

      - name: eternal-terminal
        description: Eternal Terminal - remote shell that reconnects automatically
        brew: eternal-terminal
        apt: et
        dnf: et
        pacman: eternal-terminal

  file-managers:
    description: TUI file managers
    packages:
      - name: ranger
        description: Text-based file manager
        brew: ranger
        winget: ranger.ranger
        apt: ranger
        dnf: ranger

      - name: nnn
        description: Tiny, lightning fast file manager
        brew: nnn
        winget: jarun.nnn
        choco: nnn
        apt: nnn
        dnf: nnn

      - name: lf
        description: Terminal file manager
        brew: lf
        winget: gokcehan.lf
        choco: lf
        apt: lf

  ai-assisted:
    description: AI-powered development assistants and code generation
    packages:
      - name: github-copilot-cli
        description: GitHub Copilot CLI for command suggestions
        npm: "@github/copilot"
        script: npm install -g @github/copilot

      - name: aider
        description: AI pair programming in your terminal
        pip: aider-chat
        pipx: aider-chat
        brew: aider

      - name: cody
        description: Sourcegraph Cody CLI (AI coding assistant)
        npm: "@sourcegraph/cody"
        script: npm install -g @sourcegraph/cody

      - name: continue
        description: Open-source AI code assistant
        npm: continue-cli

      - name: tabby-ai
        description: Self-hosted AI coding assistant
        brew: tabbyml/tabby/tabby
        cargo: tabby
        script: cargo install tabby

      - name: fabric
        description: AI augmentation framework for text processing
        pip: fabric-ai
        pipx: fabric-ai

      - name: shell-gpt
        description: ChatGPT in terminal (sgpt)
        pip: shell-gpt
        pipx: shell-gpt

      - name: chatgpt-cli
        description: ChatGPT command-line interface
        npm: chatgpt-cli
        pip: chatgpt-cli

  # ============================================================================
  # PROTON SUITE AND PRIVACY TOOLS
  # ============================================================================
  proton:
    description: Proton privacy-focused services
    packages:
      - name: proton-mail
        description: Proton Mail desktop client
        brew: protonmail-bridge
        winget: Proton.ProtonMail
        choco: protonmail-bridge
        flatpak: me.proton.Mail
        apt: protonmail-bridge
        dnf: protonmail-bridge

      - name: proton-mail-bridge
        description: Proton Mail Bridge for email clients (IMAP/SMTP)
        brew: protonmail-bridge
        winget: Proton.ProtonMailBridge
        choco: protonmail-bridge
        apt: protonmail-bridge
        dnf: protonmail-bridge
        flatpak: ch.protonmail.protonmail-bridge
        script: curl -sL https://proton.me/download/bridge/protonmail-bridge_linux.deb -o protonmail-bridge.deb && sudo dpkg -i protonmail-bridge.deb

      - name: proton-vpn
        description: Proton VPN client
        brew: protonvpn
        winget: Proton.ProtonVPN
        choco: protonvpn
        flatpak: com.protonvpn.www
        apt: protonvpn
        dnf: protonvpn
        snap: protonvpn
        pip: protonvpn-cli
        script: curl -sL https://repo.protonvpn.com/debian/dists/stable/main/binary-all/protonvpn-stable-release.deb -o protonvpn.deb && sudo dpkg -i protonvpn.deb

      - name: proton-vpn-cli
        description: Proton VPN command-line interface
        pip: protonvpn-cli
        apt: protonvpn-cli
        dnf: protonvpn-cli
        script: pip3 install protonvpn-cli

      - name: proton-drive
        description: Proton Drive encrypted cloud storage
        brew: proton-drive
        winget: Proton.ProtonDrive
        flatpak: me.proton.Drive

      - name: proton-pass
        description: Proton Pass password manager
        brew: proton-pass
        winget: Proton.ProtonPass
        choco: proton-pass
        flatpak: me.proton.Pass

  # ============================================================================
  # EMAIL CLIENTS
  # ============================================================================
  email-clients:
    description: Desktop email clients
    packages:
      - name: thunderbird
        description: Mozilla Thunderbird email client
        brew: thunderbird
        winget: Mozilla.Thunderbird
        choco: thunderbird
        apt: thunderbird
        dnf: thunderbird
        flatpak: org.mozilla.Thunderbird
        pacman: thunderbird
        snap: thunderbird

      - name: mailspring
        description: Mailspring modern email client
        brew: mailspring
        winget: Foundry376.Mailspring
        choco: mailspring
        flatpak: com.getmailspring.Mailspring
        snap: mailspring

      - name: betterbird
        description: Betterbird - enhanced Thunderbird fork
        brew: betterbird
        winget: Betterbird.Betterbird
        flatpak: eu.betterbird.Betterbird

      - name: geary
        description: GNOME email client
        apt: geary
        dnf: geary
        flatpak: org.gnome.Geary
        pacman: geary

      - name: evolution
        description: GNOME Evolution mail and calendar
        apt: evolution
        dnf: evolution
        flatpak: org.gnome.Evolution
        pacman: evolution

      - name: kmail
        description: KDE Kontact email client
        apt: kmail
        dnf: kmail
        flatpak: org.kde.kmail2
        pacman: kmail

      - name: claws-mail
        description: Claws Mail lightweight GTK email client
        brew: claws-mail
        apt: claws-mail
        dnf: claws-mail
        flatpak: org.claws_mail.Claws-Mail
        pacman: claws-mail

      - name: mutt
        description: Mutt text-based email client
        brew: mutt
        apt: mutt
        dnf: mutt
        pacman: mutt
        apk: mutt

      - name: neomutt
        description: NeoMutt - enhanced Mutt fork
        brew: neomutt
        apt: neomutt
        dnf: neomutt
        pacman: neomutt

      - name: aerc
        description: Terminal email client for power users
        brew: aerc
        apt: aerc
        dnf: aerc
        pacman: aerc

      - name: himalaya
        description: CLI email client written in Rust
        brew: himalaya
        cargo: himalaya
        pacman: himalaya
        script: cargo install himalaya

  # ============================================================================
  # PRIVACY-FOCUSED COMMUNICATION
  # ============================================================================
  privacy-communication:
    description: Privacy-focused messaging and communication tools
    packages:
      - name: signal-desktop
        description: Signal private messenger
        brew: signal
        winget: OpenWhisperSystems.Signal
        choco: signal
        flatpak: org.signal.Signal
        apt: signal-desktop
        dnf: signal-desktop
        snap: signal-desktop

      - name: session
        description: Session decentralized messenger
        brew: session
        winget: Oxen.Session
        flatpak: network.loki.Session
        apt: session-desktop
        snap: session-desktop

      - name: element
        description: Element Matrix client
        brew: element
        winget: Element.Element
        choco: element-desktop
        flatpak: im.riot.Riot
        apt: element-desktop
        dnf: element-desktop
        snap: element-desktop

      - name: wire
        description: Wire secure messenger
        brew: wire
        winget: Wire.Wire
        flatpak: com.wire.WireDesktop
        apt: wire-desktop

      - name: keybase
        description: Keybase encrypted communication
        brew: keybase
        winget: Keybase.Keybase
        choco: keybase
        apt: keybase
        dnf: keybase

      - name: jami
        description: Jami distributed communication (formerly Ring)
        brew: jami
        winget: SavoirFaireLinux.Jami
        flatpak: net.jami.Jami
        apt: jami
        dnf: jami
        snap: jami

      - name: briar
        description: Briar peer-to-peer encrypted messenger
        flatpak: org.briarproject.Briar

      - name: simplex
        description: SimpleX Chat private messenger
        brew: simplex
        winget: SimpleX.SimpleX
        flatpak: chat.simplex.simplex
        apt: simplex-chat

  # ============================================================================
  # VPN CLIENTS
  # ============================================================================
  vpn-clients:
    description: VPN clients, tools, and GUI applications
    packages:
      # WireGuard
      - name: wireguard-tools
        description: WireGuard VPN tools (wg, wg-quick)
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: wireguard-tools
        winget: WireGuard.WireGuard
        choco: wireguard
        apt: wireguard-tools
        dnf: wireguard-tools
        pacman: wireguard-tools
        apk: wireguard-tools
        snap: wireguard-tools

      - name: wireguard
        description: WireGuard VPN kernel module and tools
        recommended:
          linux: apt
        apt: wireguard
        dnf: wireguard-tools
        pacman: wireguard-tools
        note: "On Linux, includes kernel module. On macOS/Windows, use wireguard-tools."

      - name: wireguard-gui
        description: WireGuard official GUI client
        recommended:
          darwin: brew
          windows: winget
        brew: wireguard-tools
        winget: WireGuard.WireGuard
        choco: wireguard
        mas: "1451685025"
        note: "GUI included with WireGuard installer on Windows/macOS"

      - name: wireguard-ui
        description: WireGuard web UI for managing configs
        docker: ngoduykhanh/wireguard-ui
        script: docker run -d -p 5000:5000 ngoduykhanh/wireguard-ui

      # OpenVPN
      - name: openvpn
        description: OpenVPN client and server
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: openvpn
        winget: OpenVPNTechnologies.OpenVPN
        choco: openvpn
        apt: openvpn
        dnf: openvpn
        pacman: openvpn
        apk: openvpn
        snap: openvpn

      - name: openvpn-connect
        description: OpenVPN Connect - official GUI client
        recommended:
          darwin: brew
          windows: winget
        brew: openvpn-connect
        winget: OpenVPNTechnologies.OpenVPNConnect
        choco: openvpn-connect
        flatpak: com.tunnelblick.Tunnelblick
        apt: openvpn3
        script_deb: |
          curl -fsSL https://swupdate.openvpn.net/repos/openvpn-repo-pkg-key.pub | gpg --dearmor > /usr/share/keyrings/openvpn.gpg
          echo "deb [signed-by=/usr/share/keyrings/openvpn.gpg] https://swupdate.openvpn.net/community/openvpn3/repos/$(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/openvpn3.list
          sudo apt update && sudo apt install -y openvpn3

      - name: tunnelblick
        description: Tunnelblick - free OpenVPN client for macOS
        recommended:
          darwin: brew
        brew: tunnelblick
        mas: "1493335478"

      - name: viscosity
        description: Viscosity - premium OpenVPN client
        brew: viscosity
        winget: SparkLabs.Viscosity
        choco: viscosity

      - name: network-manager-openvpn
        description: OpenVPN plugin for NetworkManager (GNOME)
        apt: network-manager-openvpn-gnome
        dnf: NetworkManager-openvpn-gnome
        pacman: networkmanager-openvpn

      # Mesh VPN
      - name: tailscale
        description: Tailscale - zero-config mesh VPN using WireGuard
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: tailscale
        winget: tailscale.tailscale
        choco: tailscale
        apt: tailscale
        dnf: tailscale
        pacman: tailscale
        snap: tailscale
        script: curl -fsSL https://tailscale.com/install.sh | sh

      - name: zerotier
        description: ZeroTier - global virtual network
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: zerotier-one
        winget: ZeroTier.ZeroTierOne
        choco: zerotier-one
        apt: zerotier-one
        dnf: zerotier-one
        pacman: zerotier-one
        snap: zerotier
        script: curl -s https://install.zerotier.com | sudo bash

      - name: headscale
        description: Headscale - self-hosted Tailscale control server
        brew: headscale
        apt: headscale
        dnf: headscale
        pacman: headscale
        docker: headscale/headscale
        script: curl -fsSL https://github.com/juanfont/headscale/releases/latest/download/headscale_linux_amd64 -o /usr/local/bin/headscale && chmod +x /usr/local/bin/headscale

      - name: netbird
        description: Netbird - WireGuard-based mesh VPN alternative
        brew: netbirdio/tap/netbird
        winget: Netbird.Netbird
        apt: netbird
        dnf: netbird
        script: curl -fsSL https://pkgs.netbird.io/install.sh | sudo bash

      # Privacy VPN providers
      - name: mullvad-vpn
        description: Mullvad VPN client - privacy-focused
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: mullvadvpn
        winget: MullvadVPN.MullvadVPN
        choco: mullvad-app
        flatpak: net.mullvad.MullvadVPN
        apt: mullvad-vpn
        dnf: mullvad-vpn
        script: curl -fsSL https://mullvad.net/media/app/MullvadVPN-latest.deb -o mullvad.deb && sudo dpkg -i mullvad.deb

      - name: nordvpn
        description: NordVPN client
        recommended:
          darwin: brew
          windows: winget
          linux: apt
        brew: nordvpn
        winget: NordVPN.NordVPN
        choco: nordvpn
        apt: nordvpn
        dnf: nordvpn
        snap: nordvpn
        script: curl -sSf https://downloads.nordcdn.com/apps/linux/install.sh | sh

      - name: expressvpn
        description: ExpressVPN client
        recommended:
          darwin: brew
          windows: winget
        brew: expressvpn
        winget: ExpressVPN.ExpressVPN
        choco: expressvpn
        script: curl -sL https://www.expressvpn.works/clients/linux/expressvpn_latest_amd64.deb -o expressvpn.deb && sudo dpkg -i expressvpn.deb

      - name: surfshark
        description: Surfshark VPN client
        winget: Surfshark.SurfsharkVPN
        choco: surfshark
        flatpak: com.surfshark.Surfshark
        apt: surfshark
        script: curl -f https://downloads.surfshark.com/linux/debian-install.sh | sh

      - name: privateinternetaccess
        description: Private Internet Access (PIA) VPN client
        brew: private-internet-access
        winget: PrivateInternetAccess.PrivateInternetAccess
        choco: pia
        flatpak: com.privateinternetaccess.pia
        script: curl -sL https://installers.privateinternetaccess.com/download/pia-linux.run -o pia-linux.run && bash pia-linux.run

      # VPN management tools
