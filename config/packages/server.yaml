# server.yaml - Complete server setup
# Usage: rsr pkg install-profile server
#        rsr pkg install server.system
#        rsr pkg install server.networking
#
# Includes: minimal, security, monitoring profiles

name: server
description: Complete server setup with essential tools
version: "2.0.0"
category: infrastructure

includes:
  - minimal
  - security
  - monitoring

packages:
  - curl
  - wget

groups:
  system:
    description: Core system utilities
    packages:
      - name: sudo
        description: Execute commands as another user
        apt: sudo
        dnf: sudo

      - name: openssh-server
        description: OpenSSH server
        apt: openssh-server
        dnf: openssh-server

      - name: logrotate
        description: Log rotation utility
        apt: logrotate
        dnf: logrotate

      - name: cron
        description: Cron job scheduler
        apt: cron
        dnf: cronie

      - name: lshw
        description: List hardware information
        apt: lshw
        dnf: lshw

      - name: dmidecode
        description: BIOS/DMI decoder
        apt: dmidecode
        dnf: dmidecode

  networking:
    description: Network administration tools
    packages:
      - name: net-tools
        description: Network utilities
        apt: net-tools
        dnf: net-tools

      - name: dnsutils
        description: DNS utilities
        apt: dnsutils
        dnf: bind-utils

      - name: traceroute
        description: Trace route to host
        apt: traceroute
        dnf: traceroute

      - name: mtr
        description: Network diagnostic tool
        apt: mtr-tiny
        dnf: mtr

      - name: iproute2
        description: Advanced IP utilities
        apt: iproute2
        dnf: iproute

  compression:
    description: Compression tools
    packages:
      - name: gzip
        description: GNU zip
        apt: gzip
        dnf: gzip

      - name: bzip2
        description: Bzip2 compression
        apt: bzip2
        dnf: bzip2

      - name: xz-utils
        description: XZ compression utilities
        apt: xz-utils
        dnf: xz

      - name: p7zip
        description: 7-Zip compression
        apt: p7zip-full
        dnf: p7zip

  process-management:
    description: Process supervision
    packages:
      - name: supervisor
        description: Process control system
        apt: supervisor
        dnf: supervisor

  utilities:
    description: Utility tools
    packages:
      - name: rsync
        description: Fast incremental file transfer
        apt: rsync
        dnf: rsync

  management:
    description: Server management interfaces
    packages:
      - name: cockpit
        description: Web-based system management
        apt: cockpit
        dnf: cockpit

      - name: webmin
        description: Web-based system management
        apt: webmin

      - name: ansible
        description: Configuration management
        apt: ansible
        dnf: ansible

  backup:
    description: Backup and archival tools
    packages:
      - name: restic
        description: Fast and secure backup
        apt: restic
        dnf: restic

      - name: borgbackup
        description: Deduplicating backup program
        apt: borgbackup
        dnf: borgbackup

platforms:
  darwin:
    note: "macOS has built-in equivalents for most server tools"

  debian:
    note: "All tools available via apt"

  rhel:
    note: "Most tools available via dnf; use cronie instead of cron"

  alpine:
    note: "Use dcron for cron functionality"

