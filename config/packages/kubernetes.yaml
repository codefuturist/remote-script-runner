# kubernetes.yaml - Kubernetes CLI tools
# Usage: rsr pkg install-profile kubernetes
#
# Kubernetes command-line tools and utilities.
# For cluster deployment, see cloud provider documentation.

name: kubernetes
description: Kubernetes CLI tools and utilities
version: "1.0.0"
category: containers

packages:
  # Core Kubernetes CLI
  - name: kubectl
    brew: kubectl
    winget: Kubernetes.kubectl
    choco: kubernetes-cli
    apt: kubectl
    dnf: kubectl

  # Package manager for Kubernetes
  - name: helm
    brew: helm
    winget: Helm.Helm
    choco: kubernetes-helm
    apt: helm
    dnf: helm

optional:
  # Context/namespace switching
  - name: kubectx
    brew: kubectx
    winget: ahmetb.kubectx
    apt: kubectx

  - name: kubens
    brew: kubens
    apt: kubens

  # Terminal UI
  - name: k9s
    brew: k9s
    winget: k9s-io.k9s
    choco: k9s
    apt: k9s

  # Log aggregation
  - name: stern
    brew: stern
    choco: stern

  # Templating
  - name: kustomize
    brew: kustomize
    choco: kustomize

  # Local clusters
  - minikube
  - kind

  # Security
  - kubesec
  - trivy

  # GitOps
  - argocd
  - flux

platforms:
  darwin:
    packages:
      - kubectl
      - helm
      - kubectx
      - k9s
      - stern
      - kustomize
      - minikube
      - kind
    note: "All tools available via Homebrew"

  linux:
    note: |
      Install kubectl: curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      Install helm: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    packages:
      - kubectl
      - helm

# Installation scripts for tools not in package managers
install_scripts:
  kubectl: |
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

  helm: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  k9s: |
    curl -sS https://webinstall.dev/k9s | bash

