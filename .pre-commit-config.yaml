# Pre-commit hooks for Remote Script Runner
# https://pre-commit.com
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Developer Friendly Features:
# - All hooks have reasonable timeouts
# - Most hooks auto-fix issues
# - Can skip with: SKIP=hook-id git commit
# - Can skip all with: git commit --no-verify

default_stages: [commit]
fail_fast: false  # Run all hooks even if one fails

# Default timeout for all hooks (can be overridden per hook)
default_language_version:
  python: python3

repos:
  # General file checks (fast, auto-fix)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^test/libs/
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude: ^test/libs/
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
        exclude: ^test/libs/
      - id: check-shebang-scripts-are-executable
        exclude: ^test/libs/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^test/libs/
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^test/

  # Shell script linting with ShellCheck (WARNING ONLY - non-blocking)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [-x, --severity=warning]
        exclude: ^test/libs/
        types: [shell]
        files: \.(sh|bash|zsh)$
        # Non-blocking - warnings only
        verbose: true
        # Timeout after 30 seconds
        language: python
        additional_dependencies: []

  # Shell script formatting with shfmt (AUTO-FIX)
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: [-i, "4", -ci, -bn, -sr, -w]
        exclude: ^test/libs/
        types: [shell]

  # Secret scanning (baseline maintained in repo)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^test/libs/
        # Timeout after 30 seconds
        verbose: true

  # Markdown linting (WARNING ONLY)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041, --]
        exclude: ^(test/libs/|CHANGELOG\.md)
        # Auto-fix enabled

  # YAML linting (WARNING ONLY)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-d, "{extends: relaxed, rules: {line-length: disable}}"]
        exclude: ^test/libs/
        # Non-blocking
        verbose: true

# CI configuration - for GitHub Actions / GitLab CI
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: monthly
  skip: [shellcheck]  # Run shellcheck separately for better error reporting
  submodules: false
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^test/libs/

  # Additional secret scanning with gitleaks (fast fail)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args:
          [
            detect,
            --source,
            .,
            --verbose,
            --report-format,
            json,
            --report-path,
            /tmp/gitleaks-report.json,
          ]
        exclude: ^test/libs/

  # Semgrep for shell best practices
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.67.0
    hooks:
      - id: semgrep
        args: [--config=p/shell, --error]
        exclude: ^test/libs/

  # Registry sync check
  - repo: local
    hooks:
      - id: registry-sync-check
        name: Check registry.json sync
        entry: tools/build-registry.sh --check
        language: script
        files: ^(scripts/registry\.json|rsr)$
        pass_filenames: false

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041, --]
        exclude: ^(test/libs/|CHANGELOG\.md)

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-d, "{extends: relaxed, rules: {line-length: disable}}"]
        exclude: ^test/libs/

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: monthly
  skip: [shellcheck] # Run shellcheck in CI instead for better error reporting

