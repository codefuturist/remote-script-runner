# Bastion/Jump Host Pattern
# For accessing internal servers through a bastion host

# Bastion host configuration
Host bastion jump
    HostName BASTION_HOST_IP_OR_DOMAIN
    User admin
    IdentityFile ~/.ssh/id_ed25519
    Port 22
    
    # Keep connection alive
    ServerAliveInterval 60
    ServerAliveCountMax 3
    
    # Connection multiplexing for faster jumps
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%r@%h-%p
    ControlPersist 600

# Internal servers accessed via bastion
Host internal-* private-*
    ProxyJump bastion
    User admin
    IdentityFile ~/.ssh/id_ed25519
    StrictHostKeyChecking accept-new

# Example specific internal host:
# Host internal-db
#     HostName 10.0.1.50
#     ProxyJump bastion
#     User dbadmin
