# Kubernetes Nodes SSH Configuration
# For accessing Kubernetes cluster nodes

# Kubernetes master/control plane
Host k8s-master k8s-control-*
    User ubuntu
    IdentityFile ~/.ssh/id_k8s
    StrictHostKeyChecking accept-new
    
    # If behind bastion:
    # ProxyJump bastion

# Kubernetes worker nodes
Host k8s-worker-*
    User ubuntu
    IdentityFile ~/.ssh/id_k8s
    StrictHostKeyChecking accept-new
    
    # If behind bastion:
    # ProxyJump bastion

# Example specific hosts:
# Host k8s-master
#     HostName 10.0.1.10
#
# Host k8s-worker-1
#     HostName 10.0.1.21
