# Docker Host SSH Configuration
# For managing remote Docker hosts via SSH

Host docker-*
    User docker
    IdentityFile ~/.ssh/id_ed25519_docker
    
    # Docker port forwarding examples:
    # Local port 2375 → Remote Docker daemon
    # LocalForward 2375 localhost:2375
    
    # Alternative: Docker socket forwarding
    # RemoteForward /var/run/docker.sock localhost:/var/run/docker.sock

# Example production Docker host:
# Host docker-prod
#     HostName docker.example.com
#     User docker
#     LocalForward 2375 localhost:2375
#
# Then use: export DOCKER_HOST=tcp://localhost:2375
