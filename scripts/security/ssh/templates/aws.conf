# AWS EC2 SSH Configuration
# For connecting to AWS EC2 instances

Host aws-*
    User ec2-user
    IdentityFile ~/.ssh/aws-key.pem
    StrictHostKeyChecking accept-new
    
    # AWS instances often use these users
    # User ubuntu (for Ubuntu AMIs)
    # User admin (for Debian AMIs)
    
    # Optional: AWS Session Manager fallback
    # Requires AWS CLI and Session Manager plugin
    # ProxyCommand aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'

# Example specific host:
# Host aws-prod
#     HostName 54.123.45.67
#     User ec2-user
#     IdentityFile ~/.ssh/aws-prod.pem
