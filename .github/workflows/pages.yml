name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Prepare deployment files
        run: |
          mkdir -p _site
          # Copy only necessary files for the website
          cp index.html _site/
          cp CNAME _site/ 2>/dev/null || true
          cp .nojekyll _site/
          cp rsr _site/
          cp rsr.cmd _site/
          cp rsr.ps1 _site/
          cp install.sh _site/
          cp recover.sh _site/
          
          # Copy scripts directory
          if [ -d "scripts" ]; then
            cp -r scripts _site/
          fi
          
          # Copy docs if they exist
          if [ -d "docs" ]; then
            cp -r docs _site/
          fi
          
          # Copy examples if they exist  
          if [ -d "examples" ]; then
            cp -r examples _site/
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
