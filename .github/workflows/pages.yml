name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment files
        run: |
          mkdir -p _site
          # Copy site resources
          cp site/index.html _site/
          cp site/CNAME _site/ 2>/dev/null || true
          cp site/.nojekyll _site/
          # Copy entry scripts
          cp VERSION _site/
          cp rsr _site/
          cp rsr.cmd _site/
          cp rsr.ps1 _site/
          cp install.sh _site/
          cp recover.sh _site/
          # Copy registry.json (needed by index.html)
          mkdir -p _site/scripts
          cp scripts/registry.json _site/scripts/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
