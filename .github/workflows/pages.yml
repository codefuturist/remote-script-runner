name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment files
        run: |
          mkdir -p _site
          # Copy only entry scripts - other files are fetched from GitHub raw URL
          cp index.html _site/
          cp CNAME _site/ 2>/dev/null || true
          cp .nojekyll _site/
          cp VERSION _site/
          cp rsr _site/
          cp rsr.cmd _site/
          cp rsr.ps1 _site/
          cp install.sh _site/
          cp recover.sh _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
