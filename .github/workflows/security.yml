name: Security Scans

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1" # Mondays at 06:00 UTC

jobs:
    gitleaks:
        name: Secret Scan (gitleaks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@v2
              with:
                  args: detect --source . --verbose --redact --report-format sarif --report-path gitleaks.sarif

            - name: Upload SARIF to GitHub Security
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                  sarif_file: gitleaks.sarif

            - name: Upload gitleaks report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: gitleaks-report
                  path: gitleaks.sarif
                  retention-days: 14

    semgrep:
        name: Static Analysis (Semgrep)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install Semgrep
              run: python -m pip install --upgrade semgrep

            - name: Run Semgrep (shell ruleset)
              run: semgrep --config p/shell --error --sarif -o semgrep.sarif

            - name: Upload SARIF to GitHub Security
              uses: github/codeql-action/upload-sarif@v3
              if: always()
              with:
                  sarif_file: semgrep.sarif

            - name: Upload Semgrep SARIF
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: semgrep-sarif
                  path: semgrep.sarif
                  retention-days: 14
