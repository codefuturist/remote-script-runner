name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on rsr
        run: shellcheck -x --severity=warning rsr

      - name: Run ShellCheck on bash scripts
        run: shellcheck -x --severity=warning scripts/bash/*.sh

      - name: Run ShellCheck on lib scripts
        run: shellcheck -x --severity=warning lib/*.sh

      - name: Run ShellCheck on tools
        run: shellcheck -x --severity=warning tools/*.sh

  shfmt:
    name: Shell Formatting (shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install shfmt
        run: |
          curl -sS https://webinstall.dev/shfmt | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: |
          ~/.local/bin/shfmt -i 4 -ci -bn -sr -d rsr scripts/bash/*.sh lib/*.sh tools/*.sh

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check rsr syntax (POSIX sh)
        run: sh -n rsr

      - name: Check bash scripts syntax
        run: |
          for script in scripts/bash/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check lib scripts syntax
        run: |
          for script in lib/*.sh; do
            echo "Checking $script..."
            sh -n "$script"
          done

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate commits
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  psscriptanalyzer:
    name: PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PowerShell Core
        run: |
          # Install PowerShell Core on Ubuntu
          wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer

          $scripts = Get-ChildItem -Path scripts/powershell -Filter '*.ps1' -File
          $totalIssues = 0
          $hasErrors = $false

          foreach ($script in $scripts) {
              Write-Host "Analyzing: $($script.Name)" -ForegroundColor Cyan

              $results = Invoke-ScriptAnalyzer `
                  -Path $script.FullName `
                  -Settings .psscriptanalyzer/PSScriptAnalyzerSettings.psd1 `
                  -Severity @('Error', 'Warning', 'Information')

              if ($results) {
                  $totalIssues += $results.Count

                  foreach ($result in $results) {
                      $color = switch ($result.Severity) {
                          'Error'       { 'Red' }
                          'Warning'     { 'Yellow' }
                          'Information' { 'Cyan' }
                          default       { 'White' }
                      }

                      Write-Host "  [$($result.Severity)] Line $($result.Line): $($result.RuleName)" -ForegroundColor $color
                      Write-Host "    $($result.Message)" -ForegroundColor Gray

                      if ($result.Severity -eq 'Error') {
                          $hasErrors = $true
                      }
                  }
              } else {
                  Write-Host "  ✓ No issues found" -ForegroundColor Green
              }
              Write-Host ""
          }

          if ($totalIssues -gt 0) {
              Write-Host "Found $totalIssues issue(s) in PowerShell scripts" -ForegroundColor Yellow

              if ($hasErrors) {
                  Write-Host "✗ Linting failed with errors" -ForegroundColor Red
                  exit 1
              }
          } else {
              Write-Host "✓ All PowerShell scripts passed linting" -ForegroundColor Green
          }

