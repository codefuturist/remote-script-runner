name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on rsr
        run: shellcheck -x rsr

      - name: Run ShellCheck on bash scripts
        run: shellcheck -x scripts/bash/*.sh

      - name: Run ShellCheck on lib scripts
        run: shellcheck -x lib/*.sh

      - name: Run ShellCheck on tools
        run: shellcheck -x tools/*.sh

  shfmt:
    name: Shell Formatting (shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          curl -sS https://webinstall.dev/shfmt | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: |
          ~/.local/bin/shfmt -i 4 -ci -bn -sr -d rsr scripts/bash/*.sh lib/*.sh tools/*.sh

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check rsr syntax (POSIX sh)
        run: sh -n rsr

      - name: Check bash scripts syntax
        run: |
          for script in scripts/bash/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done

      - name: Check lib scripts syntax
        run: |
          for script in lib/*.sh; do
            echo "Checking $script..."
            sh -n "$script"
          done

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional

      - name: Validate commits
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

