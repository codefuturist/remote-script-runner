name: Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "scripts/**"
      - "lib/**"
      - "rsr"
      - "test/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "lib/**"
      - "rsr"
      - "test/**"

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq

      - name: Initialize BATS submodules
        run: |
          git submodule update --init --recursive

      - name: Make scripts executable
        run: |
          chmod +x rsr
          chmod +x scripts/bash/*.sh
          chmod +x test/run_tests.sh
          chmod +x test/mocks/*
          chmod +x tools/*.sh

      - name: Run unit tests
        run: |
          ./test/run_tests.sh --unit --junit test-results/unit/report.xml

      - name: Run integration tests
        run: |
          ./test/run_tests.sh --integration --junit test-results/integration/report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          retention-days: 14

      - name: Run all tests with verbose output (on failure)
        if: failure()
        run: |
          ./test/run_tests.sh --verbose

  test-powershell:
    name: PowerShell Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PowerShell Core (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install PowerShell Core (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask powershell

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PowerShell tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester

          $config = New-PesterConfiguration
          $config.Run.Path = 'test/powershell'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results/powershell/results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0) {
              Write-Host "❌ $($result.FailedCount) test(s) failed" -ForegroundColor Red
              exit 1
          } else {
              Write-Host "✅ All $($result.PassedCount) test(s) passed" -ForegroundColor Green
          }

      - name: Upload PowerShell test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-test-results-${{ matrix.os }}
          path: test-results
          retention-days: 14

  validate:
    name: Validate Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate registry.json
        run: |
          echo "Validating registry.json..."
          jq '.' scripts/registry.json > /dev/null
          echo "✓ Valid JSON"

      - name: Check all scripts exist
        run: |
          echo "Checking script files exist..."
          for path in $(jq -r '.scripts[].shells.bash // empty' scripts/registry.json); do
            if [[ ! -f "$path" ]]; then
              echo "✗ Missing: $path"
              exit 1
            else
              echo "✓ Found: $path"
            fi
          done

      - name: Run validation tool
        run: |
          chmod +x tools/validate.sh
          ./tools/validate.sh
