# Declutter Tool Configuration
# =============================

# General settings
dry_run = false
verbose = false
interactive = true

# Logging
log_level = INFO
log_file = ~/.declutter/logs/declutter.log

# Undo settings
max_undo_history = 100
use_trash = true

# Scanner settings
include_hidden = false
max_depth = -1

# Default thresholds
large_file_threshold = 100MB
old_file_days = 365

# Exclude patterns (comma-separated)
exclude_patterns = .git,.svn,node_modules,__pycache__,.cache

# Organization rules (pattern = destination)
[organization_rules]
*.jpg = Pictures/Photos
*.jpeg = Pictures/Photos
*.png = Pictures/Screenshots
*.gif = Pictures/Animations
*.mp4 = Videos
*.mov = Videos
*.mp3 = Music
*.flac = Music
*.pdf = Documents/PDFs
*.doc = Documents/Word
*.docx = Documents/Word
*.xls = Documents/Excel
*.xlsx = Documents/Excel
*.zip = Archives
*.tar.gz = Archives
*.dmg = Applications/Installers
*.app = Applications

# Custom cleanup rules
[cleanup_rules]
# Pattern = action (delete, move, compress)
*.tmp = delete
*.log = move:Logs
*.bak = delete
