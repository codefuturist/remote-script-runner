<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Script Runner (rsr) - Handy shell scripts for developers</title>
  <meta name="description" content="Collection of handy shell scripts for developers and sysadmins. Run scripts remotely with a single command. Cross-platform, shell-aware script runner.">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://codefuturist.github.io/remote-script-runner/">
  <meta property="og:title" content="Remote Script Runner - Shell scripts for developers">
  <meta property="og:description" content="Collection of handy shell scripts for developers and sysadmins with great UX">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  
  <style>
    /* CSS Variables */
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --bg-card: #21262d;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --accent-dark: #1f6feb;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --purple: #a371f7;
      --orange: #ffa657;
      --pink: #db61a2;
      --code-bg: #161b22;
      --shadow: rgba(1, 4, 9, 0.3);
      --gradient-start: #6366f1;
      --gradient-end: #8b5cf6;
      
      /* Spacing */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --spacing-2xl: 3rem;
      
      /* Border radius */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      
      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-base: 0.2s ease;
      --transition-slow: 0.3s ease;
    }

    /* Light mode */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f6f8fa;
        --bg-tertiary: #f0f2f5;
        --bg-card: #ffffff;
        --border: #d0d7de;
        --text-primary: #24292f;
        --text-secondary: #57606a;
        --text-muted: #6e7781;
        --accent: #0969da;
        --accent-hover: #0550ae;
        --accent-dark: #033d8b;
        --code-bg: #f6f8fa;
        --shadow: rgba(27, 31, 35, 0.1);
      }
    }

    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header with gradient */
    .header {
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      padding: var(--spacing-2xl) var(--spacing-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px var(--shadow);
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.4;
    }

    .header-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: var(--spacing-sm);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      letter-spacing: -1px;
    }

    .logo-icon {
      font-size: 3rem;
      margin-right: var(--spacing-sm);
      vertical-align: middle;
    }

    .tagline {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: var(--spacing-xl);
      font-weight: 400;
    }

    .header-badges {
      display: flex;
      gap: var(--spacing-md);
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-xs) var(--spacing-md);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 0.875rem;
      color: white;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .badge-icon {
      font-size: 1.1rem;
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-lg);
    }

    /* Search Bar */
    .search-section {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      padding: var(--spacing-lg) 0;
      margin-bottom: var(--spacing-xl);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .search-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .search-icon {
      position: absolute;
      left: var(--spacing-md);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1.25rem;
    }

    .search-input {
      flex: 1;
      padding: 0.875rem var(--spacing-lg) 0.875rem 3rem;
      font-size: 1rem;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      outline: none;
      transition: all var(--transition-base);
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
      background: var(--bg-primary);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .filter-buttons {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
      margin-top: var(--spacing-md);
      justify-content: center;
    }

    .filter-btn {
      padding: var(--spacing-xs) var(--spacing-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: 0.875rem;
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--bg-tertiary);
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .search-results {
      text-align: center;
      margin-top: var(--spacing-md);
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    /* Categories */
    .category-section {
      margin-bottom: var(--spacing-2xl);
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      cursor: pointer;
      user-select: none;
    }

    .category-icon {
      font-size: 1.5rem;
    }

    .category-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .category-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .collapse-icon {
      font-size: 1.25rem;
      color: var(--text-muted);
      transition: transform var(--transition-base);
    }

    .category-header.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    /* Grid */
    .scripts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--spacing-lg);
      transition: all var(--transition-base);
    }

    .scripts-grid.collapsed {
      display: none;
    }

    /* Script Card */
    .script-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      transition: all var(--transition-base);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .script-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--purple) 100%);
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .script-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .script-card:hover::before {
      opacity: 1;
    }

    .script-card.favorite {
      border-color: var(--warning);
    }

    .script-card.favorite::before {
      background: var(--warning);
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--spacing-md);
    }

    .card-icon {
      font-size: 2.5rem;
      line-height: 1;
    }

    .card-badges {
      display: flex;
      gap: var(--spacing-xs);
      align-items: center;
    }

    .new-badge {
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .favorite-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: var(--text-muted);
      transition: all var(--transition-fast);
      padding: var(--spacing-xs);
      line-height: 1;
    }

    .favorite-btn:hover {
      color: var(--warning);
      transform: scale(1.1);
    }

    .favorite-btn.active {
      color: var(--warning);
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
    }

    .card-description {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: var(--spacing-md);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-md);
    }

    .tag {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      padding: 2px var(--spacing-sm);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
    }

    .card-shells {
      display: flex;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-md);
    }

    .shell-badge {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 2px var(--spacing-sm);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
    }

    .card-actions {
      display: flex;
      gap: var(--spacing-sm);
    }

    .btn {
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      padding: var(--spacing-xl);
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: var(--spacing-xl);
      position: relative;
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--spacing-lg);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: var(--spacing-xs);
      line-height: 1;
      transition: color var(--transition-fast);
    }

    .modal-close:hover {
      color: var(--text-primary);
    }

    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin: var(--spacing-md) 0;
      position: relative;
    }

    .code-block code {
      font-family: 'Courier New', Consolas, Monaco, monospace;
      font-size: 0.875rem;
      color: var(--text-primary);
      display: block;
      overflow-x: auto;
    }

    .copy-btn {
      position: absolute;
      top: var(--spacing-sm);
      right: var(--spacing-sm);
      padding: var(--spacing-xs) var(--spacing-sm);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .copy-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .copy-btn.copied {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: var(--spacing-lg);
      opacity: 0.5;
    }

    .empty-state-title {
      font-size: 1.25rem;
      margin-bottom: var(--spacing-sm);
      color: var(--text-secondary);
    }

    .empty-state-text {
      font-size: 0.875rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: var(--spacing-xl);
      margin-top: var(--spacing-2xl);
      border-top: 1px solid var(--border);
      color: var(--text-muted);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: var(--spacing-lg);
      flex-wrap: wrap;
      margin-bottom: var(--spacing-md);
    }

    .footer-link {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .footer-link:hover {
      color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .logo {
        font-size: 2.5rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .scripts-grid {
        grid-template-columns: 1fr;
      }

      .search-section {
        position: relative;
      }

      .header-badges {
        font-size: 0.75rem;
      }
    }

    /* Loading Animation */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Utility Classes */
    .hidden {
      display: none !important;
    }

    .text-center {
      text-align: center;
    }

    .mt-1 { margin-top: var(--spacing-sm); }
    .mt-2 { margin-top: var(--spacing-md); }
    .mt-3 { margin-top: var(--spacing-lg); }
    .mb-1 { margin-bottom: var(--spacing-sm); }
    .mb-2 { margin-bottom: var(--spacing-md); }
    .mb-3 { margin-bottom: var(--spacing-lg); }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1 class="logo">
        <span class="logo-icon">🚀</span>
        Remote Script Runner
      </h1>
      <p class="tagline">Handy shell scripts for developers and sysadmins</p>
      <div class="header-badges">
        <div class="badge">
          <span class="badge-icon">🐚</span>
          Shell-Aware
        </div>
        <div class="badge">
          <span class="badge-icon">🌐</span>
          Cross-Platform
        </div>
        <div class="badge">
          <span class="badge-icon">⚡</span>
          Zero Dependencies
        </div>
        <div class="badge">
          <span class="badge-icon">🔒</span>
          Inspect First
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-container">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search scripts... (health, backup, security, docker)"
            autocomplete="off"
          />
        </div>
        <div class="filter-buttons" id="filterButtons"></div>
        <div class="search-results hidden" id="searchResults"></div>
      </div>
    </div>

    <!-- Favorites Section -->
    <div id="favoritesSection" class="hidden"></div>

    <!-- Scripts by Category -->
    <div id="scriptsContainer"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-state-icon">🔍</div>
      <h3 class="empty-state-title">No scripts found</h3>
      <p class="empty-state-text">Try a different search term or filter</p>
    </div>
  </div>

  <!-- Script Detail Modal -->
  <div id="scriptModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="https://github.com/codefuturist/remote-script-runner" class="footer-link" target="_blank" rel="noopener">GitHub</a>
      <a href="https://github.com/codefuturist/remote-script-runner/blob/main/docs/SYNTAX_GUIDE.md" class="footer-link" target="_blank" rel="noopener">Syntax Guide</a>
      <a href="https://github.com/codefuturist/remote-script-runner/blob/main/docs/HEADER_CONVENTION.md" class="footer-link" target="_blank" rel="noopener">Docs</a>
      <a href="https://github.com/codefuturist/remote-script-runner/blob/main/CONTRIBUTING.md" class="footer-link" target="_blank" rel="noopener">Contributing</a>
    </div>
    <p>Made with ♥ by <a href="https://github.com/codefuturist" class="footer-link" target="_blank" rel="noopener">codefuturist</a></p>
  </footer>

  <script>
    // State
    const state = {
      scripts: [],
      favorites: JSON.parse(localStorage.getItem('rsr-favorites') || '[]'),
      activeCategory: null,
      searchQuery: '',
      activeFilter: 'all'
    };

    // Category Icons
    const categoryIcons = {
      monitoring: '📊',
      configuration: '⚙️',
      security: '🔒',
      backup: '💾',
      maintenance: '🔧',
      networking: '🌐',
      database: '🗄️',
      all: '📦'
    };

    // Initialize
    async function init() {
      await loadScripts();
      setupEventListeners();
      renderFilterButtons();
      renderScripts();
    }

    // Load scripts from registry
    async function loadScripts() {
      try {
        const response = await fetch('scripts/registry.json');
        const data = await response.json();
        state.scripts = data.scripts;
      } catch (error) {
        console.error('Failed to load scripts:', error);
        state.scripts = [];
      }
    }

    // Event Listeners
    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');
      let searchTimeout;

      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          state.searchQuery = e.target.value.toLowerCase();
          renderScripts();
        }, 200);
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
        if (e.key === 'Escape') {
          closeModal();
          if (document.activeElement === searchInput) {
            searchInput.value = '';
            state.searchQuery = '';
            renderScripts();
          }
        }
      });

      // Close modal on background click
      document.getElementById('scriptModal').addEventListener('click', (e) => {
        if (e.target.id === 'scriptModal') {
          closeModal();
        }
      });
    }

    // Render filter buttons
    function renderFilterButtons() {
      const categories = ['all', ...new Set(state.scripts.map(s => s.category))];
      const container = document.getElementById('filterButtons');
      
      container.innerHTML = categories.map(cat => `
        <button 
          class="filter-btn ${cat === state.activeFilter ? 'active' : ''}" 
          onclick="setFilter('${cat}')"
        >
          ${categoryIcons[cat] || '📂'} ${capitalize(cat)}
        </button>
      `).join('');
    }

    // Set active filter
    function setFilter(category) {
      state.activeFilter = category;
      renderFilterButtons();
      renderScripts();
    }

    // Render all scripts
    function renderScripts() {
      const filtered = filterScripts();
      const grouped = groupByCategory(filtered);
      
      // Update search results
      updateSearchResults(filtered.length);
      
      // Show empty state if no results
      document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
      
      // Render favorites
      renderFavorites(filtered);
      
      // Render categories
      const container = document.getElementById('scriptsContainer');
      container.innerHTML = Object.entries(grouped).map(([category, scripts]) => `
        <div class="category-section">
          <div class="category-header" onclick="toggleCategory('${category}')">
            <span class="category-icon">${categoryIcons[category] || '📂'}</span>
            <h2 class="category-title">${capitalize(category)}</h2>
            <span class="category-count">${scripts.length} script${scripts.length !== 1 ? 's' : ''}</span>
            <span class="collapse-icon">▼</span>
          </div>
          <div class="scripts-grid" id="category-${category}">
            ${scripts.map(script => renderScriptCard(script)).join('')}
          </div>
        </div>
      `).join('');
    }

    // Render favorites section
    function renderFavorites(filtered) {
      const favoriteScripts = filtered.filter(s => state.favorites.includes(s.id));
      const section = document.getElementById('favoritesSection');
      
      if (favoriteScripts.length === 0) {
        section.classList.add('hidden');
        return;
      }
      
      section.classList.remove('hidden');
      section.innerHTML = `
        <div class="category-section">
          <div class="category-header">
            <span class="category-icon">⭐</span>
            <h2 class="category-title">Favorites</h2>
            <span class="category-count">${favoriteScripts.length} script${favoriteScripts.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="scripts-grid">
            ${favoriteScripts.map(script => renderScriptCard(script)).join('')}
          </div>
        </div>
      `;
    }

    // Render script card
    function renderScriptCard(script) {
      const isFavorite = state.favorites.includes(script.id);
      const shells = Object.keys(script.shells || {});
      const tags = (script.tags || []).slice(0, 3);
      
      return `
        <div class="script-card ${isFavorite ? 'favorite' : ''}" data-script-id="${script.id}">
          <div class="card-header">
            <span class="card-icon">${categoryIcons[script.category] || '📄'}</span>
            <div class="card-badges">
              ${script.isNew ? '<span class="new-badge">New</span>' : ''}
              <button class="favorite-btn ${isFavorite ? 'active' : ''}" onclick="toggleFavorite('${script.id}', event)">
                ${isFavorite ? '⭐' : '☆'}
              </button>
            </div>
          </div>
          <h3 class="card-title">${script.displayName}</h3>
          <p class="card-description">${script.description}</p>
          <div class="card-tags">
            ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <div class="card-shells">
            ${shells.map(shell => `<span class="shell-badge">${shell}</span>`).join('')}
          </div>
          <div class="card-actions">
            <button class="btn btn-primary" onclick="openModal('${script.id}', event)">
              ▶ Run Script
            </button>
            <button class="btn btn-secondary" onclick="viewScript('${script.id}', event)">
              👁 View
            </button>
          </div>
        </div>
      `;
    }

    // Filter scripts
    function filterScripts() {
      return state.scripts.filter(script => {
        // Category filter
        if (state.activeFilter !== 'all' && script.category !== state.activeFilter) {
          return false;
        }
        
        // Search filter
        if (state.searchQuery) {
          const searchStr = `${script.id} ${script.name} ${script.displayName} ${script.description} ${script.tags?.join(' ') || ''}`.toLowerCase();
          const terms = state.searchQuery.split(/\s+/);
          return terms.every(term => searchStr.includes(term));
        }
        
        return true;
      });
    }

    // Group scripts by category
    function groupByCategory(scripts) {
      return scripts.reduce((acc, script) => {
        if (!acc[script.category]) {
          acc[script.category] = [];
        }
        acc[script.category].push(script);
        return acc;
      }, {});
    }

    // Update search results counter
    function updateSearchResults(count) {
      const resultsEl = document.getElementById('searchResults');
      if (state.searchQuery) {
        resultsEl.textContent = `Found ${count} script${count !== 1 ? 's' : ''}`;
        resultsEl.classList.remove('hidden');
      } else {
        resultsEl.classList.add('hidden');
      }
    }

    // Toggle category collapse
    function toggleCategory(category) {
      const grid = document.getElementById(`category-${category}`);
      const header = grid.previousElementSibling;
      grid.classList.toggle('collapsed');
      header.classList.toggle('collapsed');
    }

    // Toggle favorite
    function toggleFavorite(scriptId, event) {
      event.stopPropagation();
      const index = state.favorites.indexOf(scriptId);
      if (index > -1) {
        state.favorites.splice(index, 1);
      } else {
        state.favorites.push(scriptId);
      }
      localStorage.setItem('rsr-favorites', JSON.stringify(state.favorites));
      renderScripts();
    }

    // Open script modal
    function openModal(scriptId, event) {
      if (event) event.stopPropagation();
      const script = state.scripts.find(s => s.id === scriptId);
      if (!script) return;
      
      const modal = document.getElementById('scriptModal');
      document.getElementById('modalTitle').textContent = script.displayName;
      document.getElementById('modalBody').innerHTML = renderModalContent(script);
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // Close modal
    function closeModal() {
      const modal = document.getElementById('scriptModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    // View script source
    function viewScript(scriptId, event) {
      if (event) event.stopPropagation();
      const script = state.scripts.find(s => s.id === scriptId);
      if (!script) return;
      
      const bashScript = script.shells?.bash || Object.values(script.shells || {})[0];
      if (bashScript) {
        window.open(`https://codefuturist.github.io/remote-script-runner/${bashScript}`, '_blank');
      }
    }

    // Render modal content
    function renderModalContent(script) {
      const shells = Object.keys(script.shells || {});
      const examples = script.examples || [];
      
      return `
        <p class="mb-2">${script.description}</p>
        
        <h3 class="mt-3 mb-1">Quick Run</h3>
        <div class="code-block">
          <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          <code>curl -fsSL https://codefuturist.github.io/remote-script-runner/rsr | sh -s -- run ${script.id}</code>
        </div>
        
        ${shells.length > 0 ? `
          <h3 class="mt-3 mb-1">Available Shells</h3>
          <div class="card-shells mb-2">
            ${shells.map(shell => `<span class="shell-badge">${shell}</span>`).join('')}
          </div>
        ` : ''}
        
        ${examples.length > 0 ? `
          <h3 class="mt-3 mb-1">Examples</h3>
          ${examples.map(ex => `
            <p class="mt-1"><strong>${ex.description}</strong></p>
            <div class="code-block">
              <button class="copy-btn" onclick="copyCode(this)">Copy</button>
              <code>${ex.command}</code>
            </div>
          `).join('')}
        ` : ''}
        
        <h3 class="mt-3 mb-1">Installation</h3>
        <div class="code-block">
          <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          <code>curl -fsSL https://codefuturist.github.io/remote-script-runner/install.sh | bash</code>
        </div>
        
        <div class="mt-3">
          <button class="btn btn-secondary" onclick="viewScript('${script.id}')">
            👁 View Source Code
          </button>
        </div>
      `;
    }

    // Copy code to clipboard
    function copyCode(button) {
      const code = button.nextElementSibling.textContent;
      navigator.clipboard.writeText(code).then(() => {
        button.textContent = 'Copied!';
        button.classList.add('copied');
        setTimeout(() => {
          button.textContent = 'Copy';
          button.classList.remove('copied');
        }, 2000);
      });
    }

    // Utility: Capitalize string
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // Start the app
    init();
  </script>
</body>
</html>
